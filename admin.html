<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Broken Ball CMS</title>

<style>

:root{
    --bg:#0b0b0b;
    --card:#171717;
    --card2:#202020;
    --accent:#ff5a1f;
    --text:#ffffff;
    --muted:#b4b4b4;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Arial, Helvetica, sans-serif;
}

.container{
    max-width:1300px;
    margin:auto;
    padding:40px 20px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.logo{
    font-size:32px;
    font-weight:bold;
}

.logo span{
    color:var(--accent);
}

.logout{
    display:inline-block;
    padding:12px 20px;
    background:#303030;
    color:white;
    text-decoration:none;
    border-radius:8px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.card{
    background:var(--card);
    padding:24px;
    border-radius:16px;
}

.card h2{
    margin-top:0;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:12px;
    border-radius:8px;
    border:none;
    background:var(--card2);
    color:white;
}

textarea{
    min-height:180px;
    resize:vertical;
}

label{
    display:block;
    margin-top:10px;
    font-weight:bold;
}

button{
    border:none;
    background:var(--accent);
    color:white;
    padding:14px;
    font-weight:bold;
    cursor:pointer;
    border-radius:8px;
    width:100%;
}

button:hover{
    opacity:.9;
}

.status{
    margin-top:15px;
    color:#6cff87;
    font-weight:bold;
}

.news-list{
    margin-top:20px;
}

.news-list select{
    min-height:250px;
}

.option-group{
    display:flex;
    gap:20px;
    margin:15px 0;
    flex-wrap:wrap;
}

.option-group label{
    margin:0;
    font-weight:normal;
}

.hidden{
    display:none;
}

.info-box{
    background:#262626;
    border-left:4px solid var(--accent);
    padding:15px;
    margin-bottom:20px;
    border-radius:8px;
}

.info-box p{
    margin:0;
    color:#ddd;
}

@media(max-width:900px){

    .grid{
        grid-template-columns:1fr;
    }

    .header{
        flex-direction:column;
        gap:20px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            Broken <span>Ball</span> CMS
        </div>

        <a href="/logout" class="logout">
            Wyloguj
        </a>

    </div>

    <div class="info-box">
        <p>
            Dodawaj aktualności, rolki Instagram oraz zarządzaj wpisami
            bez edycji news.json.
        </p>
    </div>

    <div class="grid">

        <div class="card">

            <h2>Dodaj materiał</h2>

            <form id="newsForm">

                <label>Typ wpisu</label>

                <div class="option-group">

                    <label>
                        <input
                        type="radio"
                        name="type"
                        value="article"
                        checked>
                        Aktualność
                    </label>

                    <label>
                        <input
                        type="radio"
                        name="type"
                        value="instagram">
                        Rolka Instagram
                    </label>

                </div>

                <label>Tytuł</label>

                <input
                    type="text"
                    id="title"
                    required>

                <label>Data</label>

                <input
                    type="date"
                    id="date"
                    required>

                <div id="articleFields">

                    <label>Zdjęcie</label>

                    <input
                        type="file"
                        id="image"
                        accept="image/*">

                    <label>Treść</label>

                    <textarea
                        id="text"></textarea>

                </div>

                <div
                    id="instagramFields"
                    class="hidden">

                    <label>Adres rolki Instagram</label>

                    <input
                        type="url"
                        id="instagramUrl"
                        placeholder="https://www.instagram.com/reel/...">

                </div>

                <label>Tagi</label>

                <select
                    id="tags"
                    multiple>

                    <option value="general">general</option>

                    <option value="main">main</option>

                    <option value="basket">basket</option>

                    <option value="fit">fit</option>

                    <option value="junior">junior</option>

                    <option value="graffiti">graffiti</option>

                    <option value="party">party</option>

                    <option value="music">music</option>

                    <option value="shop">shop</option>

                    <option value="extreme">extreme</option>

                    <option value="2k">2k</option>

                    <option value="tattoo">tattoo</option>

                    <option value="partner">partner</option>

                    <option value="sponsor">sponsor</option>

                    <option value="reel">reel</option>

                </select>

                <button type="submit">
                    Opublikuj materiał
                </button>

                <div
                    id="status"
                    class="status">
                </div>

            </form>

        </div>

        <div class="card">

            <h2>Usuń materiał</h2>

            <div class="news-list">

                <select id="newsSelect"></select>

                <button
                    id="deleteBtn"
                    style="margin-top:15px;">
                    Usuń wybrany wpis
                </button>

            </div>

        </div>

    </div>

</div>

<script>

const API_URL = "/news";

const articleFields =
document.getElementById(
"articleFields"
);

const instagramFields =
document.getElementById(
"instagramFields"
);

document
.querySelectorAll(
'input[name="type"]'
)
.forEach(radio => {

    radio.addEventListener(
        "change",
        () => {

            if (
                radio.value === "instagram" &&
                radio.checked
            ){

                articleFields.classList.add(
                    "hidden"
                );

                instagramFields.classList.remove(
                    "hidden"
                );

            }else if(radio.checked){

                articleFields.classList.remove(
                    "hidden"
                );

                instagramFields.classList.add(
                    "hidden"
                );

            }

        }
    );

});

async function loadNews(){

    const response =
    await fetch(API_URL);

    const news =
    await response.json();

    const select =
    document.getElementById(
        "newsSelect"
    );

    select.innerHTML = "";

    news.forEach(item => {

        const option =
        document.createElement(
            "option"
        );

        option.value =
        item.id;

        option.textContent =
        `${item.title} (${item.id})`;

        select.appendChild(
            option
        );

    });

}

loadNews();

document
.getElementById(
    "newsForm"
)
.addEventListener(
    "submit",
    async e => {

        e.preventDefault();

        const type =
        document.querySelector(
            'input[name="type"]:checked'
        ).value;

        const fd =
        new FormData();

        fd.append(
            "title",
            document.getElementById(
                "title"
            ).value
        );

        fd.append(
            "date",
            document.getElementById(
                "date"
            ).value
        );

        const tags =
        Array.from(
            document.getElementById(
                "tags"
            ).selectedOptions
        )
        .map(
            o => o.value
        );

        fd.append(
            "tags",
            tags.join(",")
        );

        fd.append(
            "type",
            type
        );

        if(type === "article"){

            fd.append(
                "text",
                document.getElementById(
                    "text"
                ).value
            );

            const image =
            document.getElementById(
                "image"
            ).files[0];

            if(image){

                fd.append(
                    "image",
                    image
                );

            }

        }else{
  fd.append(
        "text",
        ""
    );

    fd.append(
        "instagramUrl",
        document.getElementById(
            "instagramUrl"
        ).value
    );

        }

        const response =
        await fetch(
            "/add-news",
            {
                method:"POST",
                body:fd
            }
        );

        const result =
        await response.json();

        document.getElementById(
            "status"
        ).textContent =
        result.message ||
        "Dodano materiał";

        document
        .getElementById(
            "newsForm"
        )
        .reset();

        loadNews();

    }
);

document
.getElementById(
    "deleteBtn"
)
.addEventListener(
    "click",
    async () => {

        const id =
        document.getElementById(
            "newsSelect"
        ).value;

        if(!id) return;

        if(
            !confirm(
                "Czy usunąć wpis?"
            )
        ){
            return;
        }

        await fetch(
            `/delete-news/${id}`,
            {
                method:"DELETE"
            }
        );

        loadNews();

    }
);

</script>

</body>
</html>
